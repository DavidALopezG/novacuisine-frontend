<div class="main-layout">
    <aside class="sidebar bg-dark text-light p-3">
        <div class="logo-container mb-3 text-center">
            <img src="../../../../assets/imagenes/NovalogoBlack.png" alt="Logo Nova Cuisine" class="logo-img img-fluid">
        </div>

        <!-- 👤 Perfil del Usuario -->
        <div class="user-card mb-3 p-2 d-flex align-items-center gap-2">
            <div class="user-avatar">{{ inicial }}</div>
            <div class="user-details overflow-hidden">
                <div class="user-name text-truncate" [title]="nombreCompleto">{{ nombreCompleto }}</div>
                <div class="user-role-badge" [ngClass]="'role-' + rolNombre.toLowerCase()">{{ rolNombre }}</div>
            </div>
        </div>
        
        <nav class="nav flex-column gap-1">
            <a routerLink="inicio" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                <i class="bi bi-house-door-fill"></i> Inicio
            </a>

            <ng-container *ngIf="isAdmin()">
                <div class="nav-section-title text-muted small px-3 mt-3 mb-1 text-uppercase">Administración</div>
                <a routerLink="cobros" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-cash-stack"></i> Gestión de Cobros
                </a>
                <a routerLink="estudiantes" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-mortarboard-fill"></i> Gestión de Estudiantes
                </a>
                <a routerLink="usuarios" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-people-fill"></i> Gestión de Usuarios
                </a>
                <a routerLink="titulaciones" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-mortarboard-fill"></i> Titulaciones
                </a>
                <a routerLink="gestion-horarios" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-calendar3"></i> Horarios
                </a>
                <a routerLink="reportes" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-bar-chart-line-fill"></i> Reportes
                </a>
            </ng-container>

            <ng-container *ngIf="isDocente()">
                <div class="nav-section-title text-muted small px-3 mt-3 mb-1 text-uppercase">Docente</div>
                <a routerLink="mis-grupos" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-person-video3"></i> Mis Grupos
                </a>
                <a routerLink="recetario-maestro" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-book-half"></i> Recetario Maestro
                </a>
               <!-- <a routerLink="evaluaciones" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-journal-check"></i> Calificaciones
                </a>-->
                <a routerLink="gestion-horarios" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-calendar3"></i> Mi Horario
                </a>
            </ng-container>

            <ng-container *ngIf="isEstudiante()">
                <div class="nav-section-title text-muted small px-3 mt-3 mb-1 text-uppercase">Estudiante</div>
                <a routerLink="perfil" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-person-badge-fill"></i> Mi Perfil
                </a>
                <a routerLink="mis-recetas" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-egg-fried"></i> Mis Recetas
                </a>
                <a routerLink="mi-cuenta" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-receipt"></i> Estado de Cuenta
                </a>
                <a routerLink="horarios" routerLinkActive="active" class="nav-link text-light d-flex align-items-center gap-2">
                    <i class="bi bi-calendar-event"></i> Horarios de Clase
                </a>
            </ng-container>


            <button (click)="logout()" class="btn btn-danger d-flex align-items-center justify-content-center gap-2 mx-3">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </button>
        </nav>
    </aside>
    
    <main class="content">
        <router-outlet></router-outlet>
    </main>
</div>
