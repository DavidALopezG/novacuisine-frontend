<div class="gestion-usuarios">

  <div class="header-actions">
    <h2>Gestión de Usuarios</h2>
    <button class="btn-primary" (click)="abrirModalNuevoUsuario()">+ Nuevo Usuario</button>
  </div>

  <div *ngIf="mostrarForm" class="modal-overlay"> 
    <div class="form-container"> 
      <h3>{{ editando ? 'Editar Usuario' : 'Nuevo Usuario' }}</h3>

      <form [formGroup]="usuarioForm" (ngSubmit)="guardarUsuario()">

        <label>ID Usuario</label>
        <input formControlName="usuario_id" placeholder="Cédula" [readonly]="editando">

        <label>Nombre completo</label>
        <input formControlName="nombre_completo" placeholder="Nombre completo">

        <label>Email</label>
        <input formControlName="email" placeholder="Email">

        <label>Contraseña{{ editando ? ' (dejar en blanco para no cambiarla)' : '' }}</label>
        <input formControlName="contrasena" type="password" placeholder="Contraseña">

        <label>Rol</label>
        <select formControlName="rol_id">
          <option value="1">Administrador</option>
          <option value="2">Profesor</option>
          <option value="3">Estudiante</option>
        </select>

        <ng-container *ngIf="usuarioForm.value.rol_id == 3">
          <label>Titulación</label>
          <select formControlName="titulacion_id">
            <option [ngValue]="null">Selecciona una titulación...</option>
            <option *ngFor="let t of titulaciones" [ngValue]="t.titulacion_id">
              {{ t.nombre_titulacion }}
            </option>
          </select>
        </ng-container>

        <label class="switch-label">
          <span>Usuario Activo</span>
          <label class="switch">
            <input type="checkbox" formControlName="activo">
            <span class="slider"></span>
          </label>
        </label>

        <div class="form-actions"> 
          <button type="submit" class="btn-primary">{{ editando ? 'Guardar Cambios' : 'Crear Usuario' }}</button>
          <button type="button" (click)="cerrarFormulario()" class="btn-secondary">Cancelar</button>
        </div>

      </form>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" placeholder="Buscar por nombre, email o ID..." [(ngModel)]="filtroTexto" class="search-input">
    <select [(ngModel)]="filtroRol" class="category-select">
      <option value="Todos">Todos los roles</option>
      <option value="Administrador">Administrador</option>
      <option value="Profesor">Profesor</option>
      <option value="Estudiante">Estudiante</option>
    </select>
  </div>

  <app-spinner [visible]="loading"></app-spinner>
  <p *ngIf="error" class="no-results">{{ error }}</p>

  <div class="tabla-container" *ngIf="!loading && !error">
      <table>
          <thead>
              <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Email</th>
                  <th>Rol</th>
                  <th>Activo</th>
                  <th>Acciones</th>
              </tr>
          </thead>

          <tbody>
              <tr *ngFor="let u of usuariosFiltrados">
                  <td>{{ u.usuario_id }}</td>
                  <td>{{ u.nombre_completo }}</td>
                  <td>{{ u.email }}</td>
                  <td>{{ obtenerRolNombre(u.rol_id) }}</td>
                  <td>
                      <span [class.estado-activo]="u.activo" [class.estado-inactivo]="!u.activo">
                          {{ u.activo ? 'Activo' : 'Inactivo' }}
                      </span>
                  </td>
                  <td>
                      <button class="btn-edit" (click)="editarUsuario(u)">Editar</button>
                      <button class="btn-delete" (click)="toggleActivo(u)">{{ u.activo ? 'Desactivar' : 'Activar' }}</button>
                  </td>
              </tr>
          </tbody>
      </table>

      <p *ngIf="usuariosFiltrados.length === 0" class="no-results">
        No se encontraron usuarios cargados.
      </p>
  </div>

</div>
